name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 端到端测试要 tianting-console-server 和 tianting-server 的源码。console-server 的仓库建好、配好只读部署密钥之后再加进来（P-9）。
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:dist
